<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CLUEDLE</title>

  <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

  <header class="topbar">

    <div>
      <h1>CLUEDLE</h1>
      <p>
        A satirical luxury murder mystery.
      </p>
    </div>

    <div class="headerRight">

      <div id="turnCounter">
        5 TURNS LEFT
      </div>

      <button id="newGameBtn">
        NEW GAME
      </button>

    </div>

  </header>

  <main>

    <section class="gameSection">

      <h2>SUSPECTS</h2>

      <div
        id="suspectCards"
        class="cardRow"
      ></div>

    </section>

    <section class="gameSection">

      <h2>ROOMS</h2>

      <div
        id="roomCards"
        class="cardRow"
      ></div>

    </section>

    <section class="gameSection">

      <h2>WEAPONS</h2>

      <div
        id="weaponCards"
        class="cardRow"
      ></div>

    </section>

    <section class="actionPanel">

      <button id="accuseBtn">
        MAKE ACCUSATION
      </button>

    </section>

    <section class="notesPanel">

      <h2>CASE NOTES</h2>

      <div id="notes">
        Select one suspect, one room and one weapon.
      </div>

    </section>

  </main>

</div>

<script src="script.js"></script>

</body>
</html>
