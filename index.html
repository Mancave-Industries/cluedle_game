<!DOCTYPE html>
<html lang="en">
<head>
 <meta charset="UTF-8" />
 <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

 <title>CLUEDLE</title>

 <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="app">

 <header class="top-bar">

   <div class="rank-block">
     <div class="rank-label">RANK</div>
     <div id="rankName" class="rank-name">Trainee Detective</div>
   </div>

   <div class="score-block">
     <div class="score-label">DETECTION SCORE</div>
     <div id="detectionScore" class="score-value">0</div>
   </div>

   <div class="streak-block">
     <div class="streak-label">STREAK</div>
     <div id="streakValue" class="streak-value">0</div>
   </div>

 </header>

 <section class="promotion-panel">
   <div class="promotion-title">PROMOTION APPRAISAL</div>
   <div id="promotionText" class="promotion-text">
     Solve this case in 6 turns or fewer to improve your standing.
   </div>
 </section>

 <!-- SUSPECT -->
 <section class="carousel-section">

   <div class="section-title">
     SUSPECT
   </div>

   <div class="carousel-wrapper">
     <div class="carousel-track" id="suspectCarousel"></div>
   </div>

 </section>

 <!-- ROOM -->
 <section class="carousel-section">

   <div class="section-title">
     ROOM
   </div>

   <div class="carousel-wrapper">
     <div class="carousel-track" id="roomCarousel"></div>
   </div>

 </section>

 <!-- WEAPON -->
 <section class="carousel-section">

   <div class="section-title">
     WEAPON
   </div>

   <div class="carousel-wrapper">
     <div class="carousel-track" id="weaponCarousel"></div>
   </div>

 </section>

 <!-- MOTIVE -->
 <section class="carousel-section">

   <div class="section-title">
     MOTIVE
   </div>

   <div class="carousel-wrapper">
     <div class="carousel-track" id="motiveCarousel"></div>
   </div>

 </section>

 <div class="submit-container">
   <button id="submitTheoryBtn">
     SUBMIT THEORY
   </button>
 </div>

 <!-- FEEDBACK -->
 <section id="feedbackPanel">

   <div class="feedback-title">
     CASE ANALYSIS REPORT
   </div>

   <div id="feedbackContent"></div>

 </section>

</div>

<!-- DATA FILES -->
<script src="data/suspects.js"></script>
<script src="data/rooms.js"></script>
<script src="data/weapons.js"></script>
<script src="data/motives.js"></script>
<script src="data/ranks.js"></script>

<!-- MAIN ENGINE -->
<script src="script.js"></script>

</body>
</html>
